name: Build workshop projects

# GitHub only runs workflows from the repository root, so this one builds every
# companion project in the domain folders. Add a matrix entry when a project is added.

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - architecture/hexagonal-architecture-spring-boot-4
          - cloud-native/graalvm-native-image-spring-boot
          - persistence/hibernate-7-spring-data-jpa-4          # Testcontainers (Docker)
          - persistence/jakarta-data-1-0-vs-spring-data
          - security/jakarta-security-4-vs-spring-security-7/spring-security
          - security/jakarta-security-4-vs-spring-security-7/jakarta-security
          - testing/testcontainers-docker-compose-spring-boot-4  # Testcontainers (Docker)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml

      # Docker is preinstalled on ubuntu-latest, so Testcontainers works without extra setup.
      # This runs the JVM build and tests; the native image build is not part of CI.
      - name: Build and test
        run: mvn -B -ntp -f "${{ matrix.project }}/pom.xml" verify
