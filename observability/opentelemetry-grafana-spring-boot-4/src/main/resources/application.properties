spring.application.name=observability-demo

# Expose Actuator Endpoints for Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# Tracing Configuration (Spring Boot 3/4 uses Micrometer Tracing)
management.tracing.sampling.probability=1.0

# OTLP Exporter Configuration (Points to OpenTelemetry Collector, Tempo, or Jaeger)
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
