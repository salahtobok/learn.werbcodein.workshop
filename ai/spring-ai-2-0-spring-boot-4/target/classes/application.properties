spring.application.name=spring-ai-2-0-demo

# Spring AI 2.0 OpenAI Configuration
# Note: For this to work, you must provide a valid API key
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key-for-compilation}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Spring AI 2.0 Ollama Configuration (Local Fallback)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3
